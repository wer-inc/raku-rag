AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GitHub Actions OIDC provider + a deploy role the `deploy.yml` workflow assumes (no long-lived keys).
  Create ONCE per AWS account (region-agnostic IAM). Paste this into the CloudFormation console
  (Create stack > upload template) or: aws cloudformation deploy --template-file
  infra/cdk/github-oidc.cfn.yaml --stack-name raku-rag-github-oidc --capabilities CAPABILITY_NAMED_IAM
  Then copy the RoleArn output into a GitHub repo VARIABLE named AWS_DEPLOY_ROLE_ARN.

Parameters:
  GitHubOrg:
    Type: String
    Default: wer-inc
  GitHubRepo:
    Type: String
    Default: raku-rag
  GitHubSubjectFilters:
    Type: CommaDelimitedList
    Default: "repo:wer-inc/raku-rag:environment:sales,repo:wer-inc/raku-rag:environment:stg"
    Description: >
      Which GitHub OIDC subjects may assume the role. Environment-scoped subjects are used because
      deploy.yml attaches the job to a GitHub Environment. "*" (ANY branch/environment) is UNSAFE.
      Add repo:<org>/<repo>:environment:prod only after the GitHub prod Environment has reviewers.
  PermissionsMode:
    Type: String
    AllowedValues: ["cdk-scoped", "admin"]
    Default: "cdk-scoped"
    Description: >
      cdk-scoped (recommended) = the role may only assume the CDK bootstrap roles + run the
      migrate-seed task (least privilege; the real deploy power lives in the CloudFormation execution
      role, assumed only by CloudFormation). admin = AdministratorAccess (account-wide; convenience
      escape hatch if a scoped deploy hits a permissions gap — flip back to cdk-scoped afterwards).
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Set false if this AWS account ALREADY has the token.actions.githubusercontent.com provider.

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]
  IsAdmin: !Equals [!Ref PermissionsMode, "admin"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # GitHub's OIDC certificate thumbprints (AWS validates via its trusted CA; these satisfy the API).
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: raku-rag-github-deploy
      Description: Assumed by GitHub Actions (deploy.yml) via OIDC to run cdk deploy + migrate-seed.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
              StringLike:
                "token.actions.githubusercontent.com:sub": !Ref GitHubSubjectFilters
      # admin mode only: account-wide (opt-in escape hatch).
      ManagedPolicyArns: !If
        - IsAdmin
        - [arn:aws:iam::aws:policy/AdministratorAccess]
        - !Ref "AWS::NoValue"
      # cdk-scoped mode (default): least privilege. The role may only (a) assume the CDK bootstrap
      # roles — which hold the real deploy/publish permissions and whose CloudFormation execution role
      # is the only admin, assumable solely by CloudFormation — and (b) run the post-deploy migrate-seed
      # ECS task. It canNOT perform arbitrary account actions directly.
      Policies: !If
        - IsAdmin
        - !Ref "AWS::NoValue"
        - - PolicyName: raku-rag-cdk-deploy-and-migrate-seed
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                # `cdk deploy` assumes these bootstrap roles to publish assets + run CloudFormation.
                - Effect: Allow
                  Action: sts:AssumeRole
                  Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/cdk-*"
                # Discover the bootstrap qualifier/version.
                - Effect: Allow
                  Action: [ssm:GetParameter, ssm:GetParameters]
                  Resource: !Sub "arn:aws:ssm:*:${AWS::AccountId}:parameter/cdk-bootstrap/*"
                - Effect: Allow
                  Action: sts:GetCallerIdentity
                  Resource: "*"
                # scripts/aws/migrate-seed.sh runs these directly as this role after the deploy.
                - Effect: Allow
                  Action: cloudformation:DescribeStacks
                  Resource: !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/RakuRag-*/*"
                - Effect: Allow
                  Action: [ecs:RunTask, ecs:DescribeTasks, ecs:ListTasks]
                  Resource: "*"
                - Effect: Allow
                  Action: [logs:DescribeLogGroups, logs:GetLogEvents, logs:FilterLogEvents]
                  Resource: "*"
                # ECS RunTask must pass the task's execution+task roles — restricted to ECS tasks only,
                # so this cannot be used to pass a role to any other service (no privilege escalation).
                - Effect: Allow
                  Action: iam:PassRole
                  Resource: "*"
                  Condition:
                    StringEquals:
                      iam:PassedToService: ecs-tasks.amazonaws.com

Outputs:
  RoleArn:
    Description: Put this into a GitHub repo Variable named AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt GitHubDeployRole.Arn
