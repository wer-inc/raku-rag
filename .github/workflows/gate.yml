name: gate

# Operationalizes the loop-engineering "No" (docs/loop-engineering.md §1): every push/PR must pass the
# Tier-A hard gates (001 security + 002 manufacturing safety), the full suite, and RT1 compose smoke.
# This is the loop gate. (.github/workflows/ci.yml is the older 001 production-adapter skeleton.)
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Tier A hard gates + full suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 001/US1 are stdlib; US2 parsers need the [manufacturing] extra (T002).
      - name: Install manufacturing parser deps
        run: python -m pip install --quiet python-docx openpyxl
      - name: Tier A hard gates (zero tolerance)
        run: bash scripts/gate.sh a
      - name: Full suite
        run: bash scripts/gate.sh all

  tier-b:
    name: Tier B Postgres/pgvector/RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Detect Tier B relevant changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            changed="$(git diff --name-only "$base"...HEAD)"
          elif git rev-parse --verify --quiet "${before}^{commit}" >/dev/null 2>&1; then
            changed="$(git diff --name-only "$before"..."${{ github.sha }}")"
          else
            # New branch / no valid 'before' (first push reports before=000…0): cannot compute an
            # incremental diff, so DON'T silently skip a Docker-backed gate — force it to run.
            changed="__FORCE_RUN__"
          fi
          printf '%s\n' "$changed"
          if [ "$changed" = "__FORCE_RUN__" ]; then
            relevant="forced (new branch / no diff base)"
          else
            relevant="$(printf '%s\n' "$changed" | grep -E '^(infra/db/|infra/docker-compose\.yml|scripts/gate\.sh|tests/contract/test_tier_b_|src/raku_rag/(persistence|providers|services)/|\.github/workflows/gate\.yml|docs/production-gate-strategy\.md)' || true)"
          fi
          if [ -n "$relevant" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Tier B relevant changes:"; printf '%s\n' "$relevant"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Tier B relevant changes; skipping Docker-backed gate."
          fi
      - name: Install Postgres driver (parity)
        if: steps.changes.outputs.run == 'true'
        run: python -m pip install --quiet 'psycopg[binary]'
      - name: Pre-warm Postgres past first-init (avoid temp-server race)
        if: steps.changes.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -f infra/docker-compose.yml)
          "${compose[@]}" up -d postgres
          # The official postgres image runs a SHORT-LIVED temp server on the unix socket during
          # first-init (logs "accepting connections", then shuts down to restart on TCP). A socket
          # pg_isready false-positives on it, after which gate.sh races dropdb into "the database
          # system is shutting down". Force TCP (-h 127.0.0.1): the temp init server is socket-only,
          # so TCP succeeds only once the REAL server is up. Require 3 consecutive successes.
          user="${POSTGRES_USER:-raku}"
          ok=0
          for _ in $(seq 1 90); do
            if "${compose[@]}" exec -T postgres pg_isready -h 127.0.0.1 -U "$user" >/dev/null 2>&1; then
              ok=$((ok + 1)); [ "$ok" -ge 3 ] && break
            else
              ok=0
            fi
            sleep 1
          done
          if [ "$ok" -lt 3 ]; then
            echo "::error::Postgres did not become ready on TCP after first-init"
            "${compose[@]}" logs postgres | tail -50
            exit 1
          fi
          "${compose[@]}" exec -T postgres pg_isready -h 127.0.0.1 -U "$user"
      - name: Tier B bootstrap gate
        if: steps.changes.outputs.run == 'true'
        run: bash scripts/gate.sh b

  rt1-compose:
    name: RT1 local dependency compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Docker runtime
        run: |
          docker version
          docker compose version
      - name: Boot local dependency stack
        env:
          COMPOSE_PROGRESS: plain
        run: bash scripts/docker-compose-smoke.sh

  tier-d:
    name: Tier D NestJS /v1/answer facade (e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Tier D relevant changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            changed="$(git diff --name-only "$base"...HEAD)"
          elif git rev-parse --verify --quiet "${before}^{commit}" >/dev/null 2>&1; then
            changed="$(git diff --name-only "$before"..."${{ github.sha }}")"
          else
            # New branch / no valid 'before' (first push reports before=000…0): cannot compute an
            # incremental diff, so DON'T silently skip the e2e gate — force it to run.
            changed="__FORCE_RUN__"
          fi
          printf '%s\n' "$changed"
          if [ "$changed" = "__FORCE_RUN__" ]; then
            relevant="forced (new branch / no diff base)"
          else
            relevant="$(printf '%s\n' "$changed" | grep -E '^(apps/api/|apps/answer-service/|apps/web/|packages/shared/|package(-lock)?\.json|\.github/workflows/gate\.yml)' || true)"
          fi
          if [ -n "$relevant" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Tier D relevant changes:"; printf '%s\n' "$relevant"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Tier D relevant changes; skipping NestJS e2e."
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: "20"
      - name: Install workspace deps
        if: steps.changes.outputs.run == 'true'
        run: npm install --no-audit --no-fund
      - name: Build shared contracts
        if: steps.changes.outputs.run == 'true'
        run: npm run build:shared
      # The facade contract e2e stubs the Python answer-service upstream (no Postgres needed): auth
      # required; tenant taken from the signed token, not the body; request forwarded; response passed
      # through. RAG correctness itself is the Tier B parity gate.
      - name: Tier D — NestJS facade e2e
        if: steps.changes.outputs.run == 'true'
        run: npm run test:api

  separation:
    name: Verification/generation separation (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # §5: a previously-committed hard-gate/test file MUST NOT be MODIFIED alongside src in the same
      # PR (the "weaken the test to fit the impl" reward-hack). Adding NEW hard-gate tests is allowed.
      - name: Block weakening of an existing hard gate
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          protected_re='^(tests/security/|tests/contract/test_tier_b_.*\.py|infra/db/migrations/postgres/|tests/manufacturing/unit/|tests/manufacturing/test_(safety_gate|obsolete_draft_evidence|draft_only|acl_mapping|no_train|audit_coverage)\.py|scripts/gate\.sh$)'
          mod_protected="$(git diff --diff-filter=M --name-only "$base"...HEAD | grep -E "$protected_re" || true)"
          src_changed="$(git diff --name-only "$base"...HEAD | grep -E '^src/' || true)"
          if [ -n "$mod_protected" ] && [ -n "$src_changed" ]; then
            echo "::error::An existing hard-gate/test file was MODIFIED alongside src/ in the same PR."
            echo "Verification/generation separation invariant (docs/loop-engineering.md §5): gate changes"
            echo "must be an independently-reviewed change, not bundled with the impl they validate."
            echo "Modified protected files:"; echo "$mod_protected"
            exit 1
          fi
          echo "separation OK"
