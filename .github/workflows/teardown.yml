name: teardown

# Tear the AWS footprint down to zero recurring cost, from CI, using the SAME OIDC role deploy.yml
# uses (no static keys, nothing to install locally).
#
# WHY THIS WORKS WITH THE cdk-scoped ROLE:
#   the role has no direct cloudformation:DeleteStack, but it may assume `cdk-*` — which is exactly
#   how `cdk destroy` deletes a stack (assume the CDK deploy role -> CloudFormation -> cfn-exec role).
#   Pick stack_delete_method=cdk if the direct CloudFormation path is denied.
#
# SAFETY
#   - mode=list is READ-ONLY and is the default. Run it first; it is also the permission probe.
#   - Destructive modes require confirm=DESTROY typed literally.
#   - stage is restricted to sales|stg. There is no `prod` GitHub Environment and the OIDC trust
#     policy does not admit repo:...:environment:prod, so prod cannot be torn down from here by
#     design. Tear prod down deliberately, with credentials, per scripts/aws/teardown.sh.
#   - Amazon Connect instances / phone numbers are never touched (releasing a DID is irreversible).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list = read-only inventory (safe, start here) / destroy = delete the app stack / finish-delete = complete a DELETE_FAILED stack, retaining the resources that blocked it / residual = delete secrets+logs+ECR assets / residual-ci = same, but attempted through every cdk-* role the scoped role can reach, reporting what each one could and could not do"
        type: choice
        options: [list, destroy, finish-delete, residual, residual-ci]
        default: list
      stage:
        description: CDK stage to act on (also selects the GitHub Environment the OIDC subject is scoped to)
        type: choice
        options: [stg, sales]
        default: stg
      stack_delete_method:
        description: "How to delete the stack in mode=destroy. cloudformation = direct DeleteStack / cdk = `cdk destroy` via the cdk-* roles (use if direct is denied)"
        type: choice
        options: [cloudformation, cdk]
        default: cloudformation
      drop_bootstrap:
        description: "mode=residual only: also delete the CDKToolkit bootstrap stack (a future deploy must re-bootstrap)"
        type: boolean
        default: false
      retain_resources:
        description: "mode=finish-delete only: space-separated LOGICAL ids to retain (orphan, not delete). e.g. DocumentBucketAE41E5A9"
        type: string
        required: false
        default: ""
      confirm:
        description: "Type DESTROY to authorise a destructive mode. Ignored when mode=list."
        type: string
        required: false
        default: ""

permissions:
  contents: read
  id-token: write # OIDC web-identity for AWS role assumption (no static keys)

jobs:
  teardown:
    name: Teardown (${{ inputs.mode }} / ${{ inputs.stage }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }} # the OIDC trust policy matches on environment:<stage>
    concurrency:
      group: teardown-${{ inputs.stage }}
      cancel-in-progress: false
    env:
      # Inputs are passed via env and referenced as shell vars (never inlined into run: scripts) to
      # avoid GitHub Actions expression injection — same convention as deploy.yml.
      MODE: ${{ inputs.mode }}
      STAGE: ${{ inputs.stage }}
      DELETE_METHOD: ${{ inputs.stack_delete_method }}
      DROP_BOOTSTRAP: ${{ inputs.drop_bootstrap }}
      RETAIN: ${{ inputs.retain_resources }}
      CONFIRM: ${{ inputs.confirm }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

    steps:
      - name: Preflight (confirmation gate)
        run: |
          set -euo pipefail
          if [ -z "${ROLE_ARN}" ]; then
            echo "::error::repo variable AWS_DEPLOY_ROLE_ARN is not set." >&2; exit 1
          fi
          if [ "${MODE}" != "list" ] && [ "${CONFIRM}" != "DESTROY" ]; then
            echo "::error::mode=${MODE} is destructive: re-run with confirm=DESTROY typed exactly." >&2
            exit 1
          fi
          echo "mode=${MODE} stage=${STAGE} region=${AWS_REGION}"
          [ "${MODE}" = "list" ] && echo "READ-ONLY: this run changes nothing." || true

      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Probe effective permissions (non-fatal — tells us cdk-scoped vs admin)
        continue-on-error: true
        run: |
          set +e
          echo "== identity =="
          aws sts get-caller-identity
          echo
          echo "== can we read the role's own policies? (admin can; cdk-scoped cannot) =="
          aws iam list-attached-role-policies --role-name raku-rag-github-deploy 2>&1 | head -20
          echo
          echo "== can we list buckets directly? (needed to empty the versioned document bucket) =="
          aws s3api list-buckets --query 'length(Buckets[])' --output text 2>&1 | head -5
          echo
          echo "== can we describe the app stacks? =="
          aws cloudformation describe-stacks \
            --query "Stacks[?starts_with(StackName,'RakuRag-')].[StackName,StackStatus]" \
            --output text 2>&1 | head -20

      - name: Inventory (read-only)
        if: ${{ inputs.mode == 'list' }}
        run: bash scripts/aws/teardown.sh list

      - name: Destroy the app stack
        if: ${{ inputs.mode == 'destroy' && inputs.stack_delete_method == 'cloudformation' }}
        env:
          RAKU_TEARDOWN_APPROVED: "yes"
        run: bash scripts/aws/teardown.sh destroy

      - name: Destroy the app stack (via cdk destroy / the cdk-* roles)
        if: ${{ inputs.mode == 'destroy' && inputs.stack_delete_method == 'cdk' }}
        working-directory: infra/cdk
        run: |
          set -euo pipefail
          npm ci
          # `cdk destroy` synthesises the app to resolve the stack, so it needs the stage context.
          npx cdk destroy "RakuRag-${STAGE}" --force --context "stage=${STAGE}"

      - name: Finish a DELETE_FAILED stack (via the CDK deploy role)
        if: ${{ inputs.mode == 'finish-delete' }}
        # `cdk destroy` stops at the first resource that will not delete (the versioned document
        # bucket) and leaves the REST OF THE STACK STANDING — including the NAT gateway, which is the
        # single biggest line item left. Re-issue the delete directly, retaining only the blocker.
        # The GitHub role has no cloudformation:DeleteStack of its own; the cdk-* deploy role does,
        # which is the whole reason the scoped role may assume it.
        run: |
          set -euo pipefail
          if ! printf '%s' "${RETAIN}" | grep -qE '^[A-Za-z0-9 ]*$'; then
            echo "::error::retain_resources must be space-separated alphanumeric logical ids." >&2
            exit 1
          fi
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          ROLE="arn:aws:iam::${ACCOUNT}:role/cdk-hnb659fds-deploy-role-${ACCOUNT}-${AWS_REGION}"
          echo "assuming ${ROLE}"
          CREDS="$(aws sts assume-role --role-arn "${ROLE}" --role-session-name raku-teardown \
            --query Credentials --output json)"
          for k in AccessKeyId SecretAccessKey SessionToken; do
            v="$(printf '%s' "${CREDS}" | python3 -c "import json,sys;print(json.load(sys.stdin)['$k'])")"
            echo "::add-mask::${v}"
            case "$k" in
              AccessKeyId) export AWS_ACCESS_KEY_ID="$v" ;;
              SecretAccessKey) export AWS_SECRET_ACCESS_KEY="$v" ;;
              SessionToken) export AWS_SESSION_TOKEN="$v" ;;
            esac
          done

          STACK="RakuRag-${STAGE}"
          echo "== current status =="
          aws cloudformation describe-stacks --stack-name "${STACK}" \
            --query 'Stacks[0].StackStatus' --output text
          echo "== resources still standing (these are what is still billing) =="
          aws cloudformation describe-stack-resources --stack-name "${STACK}" \
            --query 'StackResources[?ResourceStatus!=`DELETE_COMPLETE`].[ResourceType,LogicalResourceId,ResourceStatus]' \
            --output text

          echo "== deleting ${STACK} (retaining: ${RETAIN:-none}) =="
          # shellcheck disable=SC2086 -- RETAIN is a validated space-separated id list
          if [ -n "${RETAIN}" ]; then
            aws cloudformation delete-stack --stack-name "${STACK}" --retain-resources ${RETAIN}
          else
            aws cloudformation delete-stack --stack-name "${STACK}"
          fi
          aws cloudformation wait stack-delete-complete --stack-name "${STACK}" || {
            echo "::error::delete still did not complete. Remaining failures:" >&2
            aws cloudformation describe-stack-events --stack-name "${STACK}" \
              --query "StackEvents[?ResourceStatus=='DELETE_FAILED'].[LogicalResourceId,ResourceStatusReason]" \
              --output text >&2 || true
            exit 1
          }
          echo "${STACK} deleted."

      - name: Residual cleanup, attempted through every reachable role
        if: ${{ inputs.mode == 'residual-ci' }}
        # The GitHub role is cdk-scoped: no s3:*, no ecr:*, no secretsmanager:*, no logs:Delete*.
        # But the cdk-* roles it MAY assume hold some of those on the bootstrap resources —
        # file-publishing has s3:DeleteObject* on the assets bucket, image-publishing has ECR.
        # Attempt each item with the best role available; never fail the step on a denial, and
        # print a matrix so what is genuinely unreachable from CI is recorded rather than guessed.
        env:
          DOC_BUCKET_HINT: raku-rag
        run: |
          # GitHub runs `bash -e`, which would abort this step at the first denial — but a denial IS
          # the result we are here to record. Turn it off explicitly.
          set +e
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          Q=hnb659fds
          mkdir -p ~/.aws
          # credential_source=Environment chains off the OIDC creds already exported by the
          # configure-aws-credentials step, so each profile is just "assume that cdk-* role".
          {
            for r in file-publishing image-publishing deploy lookup; do
              printf '[profile %s]\nrole_arn = arn:aws:iam::%s:role/cdk-%s-%s-role-%s-%s\ncredential_source = Environment\n\n' \
                "$r" "$ACCOUNT" "$Q" "$r" "$ACCOUNT" "${AWS_REGION}"
            done
          } > ~/.aws/config

          RESULT=""
          record() { RESULT="${RESULT}\n$1\t$2\t$3"; }

          try() { # try <label> <role-or-default> <cmd...>
            local label="$1" prof="$2"; shift 2
            local out rc
            if [ "$prof" = "default" ]; then out="$("$@" 2>&1)"; rc=$?
            else out="$(AWS_PROFILE="$prof" "$@" 2>&1)"; rc=$?
            fi
            if [ $rc -eq 0 ]; then
              record "$label" "$prof" "OK"
              [ -n "$out" ] && echo "$out" | head -5
            else
              record "$label" "$prof" "DENIED/FAILED"
              echo "$out" | head -3
            fi
            return 0
          }

          empty_bucket() { # empty_bucket <profile> <bucket>
            local prof="$1" b="$2"
            while :; do
              local batch
              batch="$(AWS_PROFILE="$prof" aws s3api list-object-versions --bucket "$b" --max-keys 500 \
                --query '{Objects: [Versions,DeleteMarkers][][].{Key:Key,VersionId:VersionId}}' \
                --output json 2>/dev/null)" || return 1
              case "$batch" in *'"Objects": null'*|*'"Objects":null'*) return 0 ;; esac
              printf '%s' "$batch" > /tmp/batch.json
              AWS_PROFILE="$prof" aws s3api delete-objects --bucket "$b" \
                --delete file:///tmp/batch.json >/dev/null 2>&1 || return 1
            done
          }

          echo "##### 1. CDK staging bucket (asset zips) #####"
          ASSETS="cdk-${Q}-assets-${ACCOUNT}-${AWS_REGION}"
          if empty_bucket file-publishing "$ASSETS"; then record "cdk assets bucket emptied" file-publishing OK
          else record "cdk assets bucket emptied" file-publishing "DENIED/FAILED"; fi

          echo "##### 2. ECR CDK container assets (the ~2GB Docling images) #####"
          REPO="cdk-${Q}-container-assets-${ACCOUNT}-${AWS_REGION}"
          IDS="$(AWS_PROFILE=image-publishing aws ecr list-images --repository-name "$REPO" \
            --query 'imageIds[*]' --output json 2>&1)"
          if printf '%s' "$IDS" | head -c1 | grep -q '\['; then
            printf '%s' "$IDS" > /tmp/imgs.json
            N="$(python3 -c 'import json;print(len(json.load(open("/tmp/imgs.json"))))')"
            echo "  $N images found"
            try "ecr images purged ($N)" image-publishing \
              aws ecr batch-delete-image --repository-name "$REPO" --image-ids file:///tmp/imgs.json
          else
            record "ecr list-images" image-publishing "DENIED/FAILED"; echo "$IDS" | head -3
          fi

          echo "##### 3. Retained document bucket(s) #####"
          for prof in default file-publishing deploy; do
            try "s3 list-buckets" "$prof" aws s3api list-buckets --query 'length(Buckets[])' --output text
          done

          echo "##### 4. Secrets / log groups #####"
          try "secretsmanager list-secrets" default aws secretsmanager list-secrets --max-results 1
          try "logs describe-log-groups" default aws logs describe-log-groups --limit 1

          echo
          echo "================ RESIDUAL CLEANUP MATRIX ================"
          printf 'ITEM\tROLE\tRESULT\n'
          printf "$RESULT\n" | sed '/^$/d'
          echo "========================================================="
          echo "Anything DENIED/FAILED above is unreachable from CI and needs real credentials."

      - name: Clean residual (secrets, log groups, ECR assets)
        if: ${{ inputs.mode == 'residual' }}
        env:
          RAKU_TEARDOWN_APPROVED: "yes"
          RAKU_TEARDOWN_DROP_BOOTSTRAP: ${{ inputs.drop_bootstrap && 'yes' || 'no' }}
        run: bash scripts/aws/teardown.sh residual

      - name: What still bills
        if: ${{ always() && inputs.mode != 'list' }}
        run: |
          echo "Amazon Connect instances and claimed phone numbers are NEVER touched by this workflow"
          echo "(releasing a DID is irreversible). Release them in the console if you want them gone."
          echo "KMS keys stay in a 7-30 day pending-deletion window and bill until it elapses."
