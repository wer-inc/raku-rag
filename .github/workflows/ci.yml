name: ci

# P0-T16 — CI skeleton. Stage order: lint → unit → contract → integration → security-hard-gate → eval-gate.
# The security hard gate is a BLOCKING job (baseline-independent; one failure blocks merge).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: pip install ruff black mypy
      - name: Lint (ruff + black --check)
        run: |
          ruff check src tests workers
          black --check src tests workers
      - name: Unit tests
        run: python -m unittest discover -s tests/unit -v
      - name: Contract tests
        run: python -m unittest discover -s tests/contract -v
      - name: Integration tests
        run: python -m unittest discover -s tests/integration -v
      - name: Migration runner smoke (sqlite framework — asserts apply + idempotency)
        run: |
          set -euo pipefail
          # FIX (P1-12): the old step pointed at infra/db/migrations (only .gitkeep there; the real
          # SQL is in postgres/, which is non-recursive-discovered AND Postgres-only) so it applied 0
          # migrations and silently passed. Run the runner against the sqlite framework smoke set and
          # ASSERT it applied a migration and is idempotent, so a no-op can never pass again.
          rm -f /tmp/ci.sqlite
          out="$(python -m raku_rag.migrations.runner --dir infra/db/migrations/sqlite --db /tmp/ci.sqlite)"
          echo "$out"
          echo "$out" | grep -q "applied 1 migration" || { echo "::error::migration runner applied 0 migrations — false-positive smoke"; exit 1; }
          out2="$(python -m raku_rag.migrations.runner --dir infra/db/migrations/sqlite --db /tmp/ci.sqlite)"
          echo "$out2"
          echo "$out2" | grep -q "no pending migrations" || { echo "::error::migration runner is not idempotent"; exit 1; }
          echo "Real Postgres+pgvector migrations are validated in gate.yml (tier-b) + scripts/postgres-migration-smoke.sh."

  security-hard-gate:
    # BLOCKING: ACL leak / tenant isolation / deletion reappearance must pass regardless of baseline.
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Security hard-gate tests
        run: python -m unittest discover -s tests/security -v

  eval-gate:
    # BLOCKING: text+visual quality metrics, baseline regression, and eval security hard-gates must stay green.
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluation gate
        run: >
          python -m unittest
          tests.integration.test_eval
          tests.integration.test_visual_eval
          tests.security.test_eval_hard_gate
          tests.security.test_visual_eval_hard_gate
          tests.unit.test_eval_baseline_gate
          -v

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build shared contracts
        run: npm run build:shared
      - name: Typecheck workspaces
        run: npm run typecheck
      - name: API e2e (NestJS skeleton)
        run: npm run test:api
