name: deploy

# CD via GitHub Actions — builds the container images ON THE RUNNER (which has Docker) and runs
# `cdk deploy`, so NO local/sandbox Docker is needed anywhere. AWS auth is OIDC role assumption
# (no long-lived keys in the repo). One-time setup: create the OIDC provider + deploy role from
# infra/cdk/github-oidc.cfn.yaml, then set repo Variables AWS_DEPLOY_ROLE_ARN (+ optional AWS_REGION).
# See infra/cdk/DEPLOY-CI.md.
#
# Manual only (workflow_dispatch); dry_run defaults to true → synth/plan only, changes nothing.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: CDK stage (sales = cheap/throwaway, stg = staging, prod = HA/retained)
        type: choice
        options: [sales, stg, prod]
        default: sales
      frontend:
        description: Frontend hosting (aws-nextjs = same-origin web+API on one ALB)
        type: choice
        options: [aws-nextjs, external-vercel]
        default: aws-nextjs
      domain_name:
        description: Optional custom domain for HTTPS (blank = HTTP:80). e.g. demo.example.com
        type: string
        required: false
        default: ""
      auth_mode:
        description: Application authentication mode
        type: choice
        options: [dev, cognito]
        default: dev
      basic_auth:
        description: Enable HTTP Basic auth in front of the AWS-hosted web app
        type: boolean
        default: false
      basic_auth_user:
        description: Basic auth username when basic_auth is enabled
        type: string
        required: false
        default: raku
      run_migrate_seed:
        description: After deploy, apply schema migrations + seed the demo KB
        type: boolean
        default: true
      run_live_smoke:
        description: After deploy, run Cognito-authenticated live smoke checks (requires Environment secrets/vars)
        type: boolean
        default: false
      embedding_provider:
        description: Embedding provider (openai needs a `raku-rag/openai-api-key` Secrets Manager secret)
        type: choice
        options: [hashing, openai]
        default: hashing
      answer_llm:
        description: Answer LLM (bedrock = Bedrock Claude / openai = OpenAI Chat / gemini = Google Gemini; openai reuses raku-rag/openai-api-key, gemini needs raku-rag/gemini-api-key)
        type: choice
        options: [extractive, bedrock, openai, gemini]
        default: extractive
      structured_ingest:
        description: ADR-018 ingestion (docling = Docling-first quality-gated pipeline, bakes Docling into the worker/answer images and bumps their Fargate size; +bedrock-vision also drafts difficult pages via Claude vision, HITL-gated)
        type: choice
        options: ["off", "docling", "docling+bedrock-vision"]
        default: "off"
      visual_provider_profile:
        description: Visual/PDF providers (promotion remains off unless CDK context explicitly enables it)
        type: choice
        options: [default, aws-textract-bedrock]
        default: default
      visual_evidence_promotion:
        description: Allow verified visual citations to satisfy high-risk evidence rules
        type: boolean
        default: false
      visual_verifier_models:
        description: Comma-separated Bedrock verifier model ids, e.g. model-a,model-b
        type: string
        required: false
        default: ""
      visual_verifier_same_family_attestation:
        description: Permit same provider family only when two distinct Bedrock models are explicitly attested
        type: boolean
        default: false
      bedrock_guardrail_id:
        description: Bedrock Guardrail id for the production output guardrail (answer path FAILS CLOSED under runtime_profile=production without it)
        type: string
        required: false
        default: ""
      bedrock_guardrail_version:
        description: Bedrock Guardrail version (e.g. 1); required when bedrock_guardrail_id is set
        type: string
        required: false
        default: ""
      phone_telephony:
        description: Live telephony channel (connect = deploy the Amazon Connect adapter Lambda + DID map SSM)
        type: choice
        options: [none, connect]
        default: none
      connect_instance_arn:
        description: Amazon Connect instance ARN (scopes the Lambda invoke permission; required when phone_telephony=connect; default = the stg instance)
        type: string
        required: false
        default: "arn:aws:connect:ap-northeast-1:902353451555:instance/61bbc4a9-04dd-4c82-86f0-8bd8f50e0793"
      https_front:
        description: HTTPS entry point without a custom domain (cloudfront = CloudFront in front of the public ALB; browser mic etc. need a secure context)
        type: choice
        options: [none, cloudfront]
        default: none
      expected_sha:
        description: Optional full commit SHA expected to deploy; fail before AWS changes if the run SHA differs
        type: string
        required: false
        default: ""
      dry_run:
        description: Synth/plan only (no AWS changes)
        type: boolean
        default: true
      allow_stg_downgrade:
        description: Bypass the stg profile guard (deliberately deploy stg WITHOUT a known-good capability — CloudFront/structured ingest/Connect/guardrail get REMOVED when their input is omitted)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # OIDC web-identity for AWS role assumption (no static keys)

jobs:
  deploy:
    name: Deploy (${{ inputs.stage }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }} # add required reviewers on the `prod` Environment for a gate
    concurrency:
      group: deploy-${{ inputs.stage }}
      cancel-in-progress: false
    env:
      # All workflow_dispatch inputs are passed via env and referenced as shell vars (never inlined into
      # run: scripts) to avoid GitHub Actions expression injection. STAGE/FRONTEND are constrained
      # choices; DOMAIN_NAME is free text and is format-validated in Preflight before any use.
      STAGE: ${{ inputs.stage }}
      FRONTEND: ${{ inputs.frontend }}
      DOMAIN_NAME: ${{ inputs.domain_name }}
      AUTH_MODE: ${{ inputs.auth_mode }}
      BASIC_AUTH: ${{ inputs.basic_auth }}
      BASIC_AUTH_USER: ${{ inputs.basic_auth_user }}
      EMBEDDING_PROVIDER: ${{ inputs.embedding_provider }}
      ANSWER_LLM: ${{ inputs.answer_llm }}
      STRUCTURED_INGEST: ${{ inputs.structured_ingest }}
      VISUAL_PROVIDER_PROFILE: ${{ inputs.visual_provider_profile }}
      VISUAL_EVIDENCE_PROMOTION: ${{ inputs.visual_evidence_promotion }}
      VISUAL_VERIFIER_MODELS: ${{ inputs.visual_verifier_models }}
      VISUAL_VERIFIER_SAME_FAMILY_ATTESTATION: ${{ inputs.visual_verifier_same_family_attestation }}
      BEDROCK_GUARDRAIL_ID: ${{ inputs.bedrock_guardrail_id }}
      BEDROCK_GUARDRAIL_VERSION: ${{ inputs.bedrock_guardrail_version }}
      PHONE_TELEPHONY: ${{ inputs.phone_telephony }}
      CONNECT_INSTANCE_ARN: ${{ inputs.connect_instance_arn }}
      HTTPS_FRONT: ${{ inputs.https_front }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      ALLOW_STG_DOWNGRADE: ${{ inputs.allow_stg_downgrade }}
      # Textract is not available in every AWS region where the app can run (for example Tokyo).
      # Keep the app stack regional, but route Textract OCR/layout calls to a supported region by
      # default. Override with repo/environment Variable TEXTRACT_REGION if residency requires it.
      TEXTRACT_REGION: ${{ vars.TEXTRACT_REGION || 'ap-southeast-1' }}
      ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Preflight
        run: |
          set -euo pipefail
          if [ -z "${ROLE_ARN}" ]; then
            echo "::error::Set repo Variable AWS_DEPLOY_ROLE_ARN (OIDC deploy role). See infra/cdk/DEPLOY-CI.md."
            exit 1
          fi
          remote_develop_sha=""
          if [ -n "${EXPECTED_SHA}" ] && ! printf '%s\n' "${EXPECTED_SHA}" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::expected_sha must be a full 40-character lowercase hex commit SHA."
            exit 1
          fi
          if [ -n "${EXPECTED_SHA}" ] && [ "${GITHUB_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Refusing deploy: expected_sha=${EXPECTED_SHA} but workflow is pinned to github.sha=${GITHUB_SHA}."
            echo "::error::Re-run the workflow with ref pointing at the expected commit, or update expected_sha after confirming the new head."
            exit 1
          fi
          if [ "${GITHUB_REF_NAME:-}" = "develop" ]; then
            remote_develop_sha="$(git ls-remote --heads origin develop | awk '{print $1}')"
            if [ -z "${remote_develop_sha}" ]; then
              echo "::error::Could not resolve origin/develop. Refusing develop deploy without head verification."
              exit 1
            fi
            if [ "${remote_develop_sha}" != "${GITHUB_SHA}" ]; then
              echo "::error::Refusing stale develop deploy: workflow github.sha=${GITHUB_SHA}, origin/develop=${remote_develop_sha}."
              echo "::error::develop moved after this run was queued or selected. Re-run deploy for the current head."
              exit 1
            fi
          fi
          # DOMAIN_NAME is free-text input — allow only hostname chars (or empty); reject anything else.
          # Skip the regex when blank: an empty string yields no line for grep to match, which would
          # otherwise (incorrectly) fail validation for the no-domain / HTTP-only case.
          if [ -n "${DOMAIN_NAME}" ] && ! printf '%s\n' "${DOMAIN_NAME}" | grep -qE '^[A-Za-z0-9.-]+$'; then
            echo "::error::domain_name must be a hostname ([A-Za-z0-9.-]) or blank."
            exit 1
          fi
          if [ "${BASIC_AUTH}" = "true" ] && ! printf '%s\n' "${BASIC_AUTH_USER}" | grep -qE '^[A-Za-z0-9._@+-]{1,128}$'; then
            echo "::error::basic_auth_user must be 1-128 chars: A-Za-z0-9._@+-"
            exit 1
          fi
          if [ -n "${VISUAL_VERIFIER_MODELS}" ] && ! printf '%s\n' "${VISUAL_VERIFIER_MODELS}" | grep -qE '^[A-Za-z0-9._:/,-]+$'; then
            echo "::error::visual_verifier_models may contain only A-Za-z0-9._:/,-"
            exit 1
          fi
          if [ -n "${BEDROCK_GUARDRAIL_ID}" ] && ! printf '%s\n' "${BEDROCK_GUARDRAIL_ID}" | grep -qE '^[a-z0-9]{1,64}$'; then
            echo "::error::bedrock_guardrail_id must be the short lowercase alphanumeric guardrail id"
            exit 1
          fi
          if [ -n "${BEDROCK_GUARDRAIL_VERSION}" ] && ! printf '%s\n' "${BEDROCK_GUARDRAIL_VERSION}" | grep -qE '^(DRAFT|[0-9]{1,6})$'; then
            echo "::error::bedrock_guardrail_version must be DRAFT or a number"
            exit 1
          fi
          if [ -n "${BEDROCK_GUARDRAIL_ID}" ] && [ -z "${BEDROCK_GUARDRAIL_VERSION}" ]; then
            echo "::error::bedrock_guardrail_version is required when bedrock_guardrail_id is set"
            exit 1
          fi
          if [ -n "${CONNECT_INSTANCE_ARN}" ] && ! printf '%s\n' "${CONNECT_INSTANCE_ARN}" | grep -qE '^arn:aws:connect:[a-z0-9-]+:[0-9]{12}:instance/[a-f0-9-]{36}$'; then
            echo "::error::connect_instance_arn must be a Connect instance ARN"
            exit 1
          fi
          if [ "${PHONE_TELEPHONY}" = "connect" ] && [ -z "${CONNECT_INSTANCE_ARN}" ]; then
            echo "::error::connect_instance_arn is required when phone_telephony=connect"
            exit 1
          fi
          case "${VISUAL_PROVIDER_PROFILE}" in
            default|aws-textract-bedrock) ;;
            *)
              echo "::error::visual_provider_profile must be default or aws-textract-bedrock."
              exit 1
              ;;
          esac
          case "${HTTPS_FRONT}" in
            none|cloudfront) ;;
            *)
              echo "::error::https_front must be none or cloudfront."
              exit 1
              ;;
          esac
          if [ "${HTTPS_FRONT}" = "cloudfront" ] && [ -n "${DOMAIN_NAME}" ]; then
            echo "::error::https_front=cloudfront is for the no-domain case; domain_name already provides HTTPS (ACM at the ALB)."
            exit 1
          fi
          if [ "${HTTPS_FRONT}" = "cloudfront" ] && [ "${FRONTEND}" != "aws-nextjs" ]; then
            echo "::error::https_front=cloudfront requires frontend=aws-nextjs (the web-owned public ALB is the origin)."
            exit 1
          fi
          echo "stage=${STAGE} frontend=${FRONTEND} auth=${AUTH_MODE} visual=${VISUAL_PROVIDER_PROFILE} domain='${DOMAIN_NAME}' https_front=${HTTPS_FRONT} region=${AWS_REGION}"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            commit_subject="$(git log -1 --pretty=%s | sed 's/|/\\|/g')"
            {
              echo "## Deploy identity"
              echo ""
              echo "| Field | Value |"
              echo "|---|---|"
              echo "| stage | \`${STAGE}\` |"
              echo "| ref | \`${GITHUB_REF_NAME:-unknown}\` |"
              echo "| github.sha | \`${GITHUB_SHA}\` |"
              echo "| expected_sha | \`${EXPECTED_SHA:-not provided}\` |"
              echo "| origin/develop | \`${remote_develop_sha:-not checked}\` |"
              echo "| subject | ${commit_subject} |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # stg carries live capabilities that are context-driven and get REMOVED when their input is
      # omitted (CloudFront distro + Cognito URLs, structured ingestion + task sizing, Connect
      # adapter, output guardrail). Dispatching with GitHub's input defaults therefore silently
      # downgrades the environment — this guard makes a downgrade an explicit decision.
      - name: Preflight (stg profile guard)
        if: inputs.stage == 'stg'
        run: |
          set -euo pipefail
          if [ "${ALLOW_STG_DOWNGRADE}" = "true" ]; then
            echo "stg profile guard: BYPASSED via allow_stg_downgrade=true"
            exit 0
          fi
          fail=0
          req() {
            local label="$1" actual="$2"; shift 2
            for want in "$@"; do
              [ "${actual}" = "${want}" ] && return 0
            done
            echo "::error::stg profile drift: ${label}='${actual}' (expected one of: $*)"
            fail=1
          }
          req https_front "${HTTPS_FRONT}" cloudfront
          req structured_ingest "${STRUCTURED_INGEST}" docling docling+bedrock-vision
          req embedding_provider "${EMBEDDING_PROVIDER}" openai
          req answer_llm "${ANSWER_LLM}" bedrock
          req visual_provider_profile "${VISUAL_PROVIDER_PROFILE}" aws-textract-bedrock
          req phone_telephony "${PHONE_TELEPHONY}" connect
          if [ -z "${BEDROCK_GUARDRAIL_ID}" ] || [ -z "${BEDROCK_GUARDRAIL_VERSION}" ]; then
            echo "::error::stg profile drift: bedrock_guardrail_id/bedrock_guardrail_version must be set (the production profile fails closed without a guardrail)"
            fail=1
          fi
          if [ "${fail}" != "0" ]; then
            echo "The inputs above would remove live stg capabilities. If the downgrade is deliberate,"
            echo "re-run with allow_stg_downgrade=true. Known-good stg dispatch is documented in infra/cdk/DEPLOY-CI.md."
            exit 1
          fi
          echo "stg profile guard: OK"

      - name: Install + build CDK app
        working-directory: infra/cdk
        run: npm ci && npm run build

      - name: Synth (always — validates the template, no AWS changes)
        working-directory: infra/cdk
        run: |
          set -euo pipefail
          CTX="--context stage=${STAGE} --context frontendHosting=${FRONTEND} --context authMode=${AUTH_MODE}"
          if [ -n "${DOMAIN_NAME}" ]; then CTX="${CTX} --context domainName=${DOMAIN_NAME}"; fi
          if [ "${BASIC_AUTH}" = "true" ]; then CTX="${CTX} --context basicAuthUser=${BASIC_AUTH_USER}"; fi
          if [ "${EMBEDDING_PROVIDER}" = "openai" ]; then CTX="${CTX} --context embeddingProvider=openai"; fi
          if [ "${ANSWER_LLM}" != "extractive" ]; then CTX="${CTX} --context answerLlm=${ANSWER_LLM}"; fi
          if [ "${STRUCTURED_INGEST}" = "docling" ] || [ "${STRUCTURED_INGEST}" = "docling+bedrock-vision" ]; then
            CTX="${CTX} --context structuredIngest=true"
          fi
          if [ "${STRUCTURED_INGEST}" = "docling+bedrock-vision" ]; then
            CTX="${CTX} --context ingestVision=bedrock"
          fi
          if [ "${VISUAL_PROVIDER_PROFILE}" = "aws-textract-bedrock" ]; then
            CTX="${CTX} --context ocrProvider=aws_textract --context layoutProvider=aws_textract --context structuredProvider=aws_textract --context captioningProvider=bedrock --context vlmProvider=bedrock --context textractRegion=${TEXTRACT_REGION} --context ocrRegion=${TEXTRACT_REGION}"
          fi
          if [ "${VISUAL_EVIDENCE_PROMOTION}" = "true" ]; then
            CTX="${CTX} --context visualEvidencePromotion=true --context visualEvidenceVerifierQuorum=2"
          fi
          if [ -n "${VISUAL_VERIFIER_MODELS}" ]; then
            VERIFIERS="$(printf '%s' "${VISUAL_VERIFIER_MODELS}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' | sed 's/^/bedrock:/' | paste -sd, -)"
            CTX="${CTX} --context visualEvidenceVerifiers=${VERIFIERS}"
          fi
          if [ "${VISUAL_VERIFIER_SAME_FAMILY_ATTESTATION}" = "true" ]; then
            CTX="${CTX} --context visualVerifierAllowSameFamilyDistinctModels=true"
          fi
          if [ -n "${BEDROCK_GUARDRAIL_ID}" ]; then
            CTX="${CTX} --context bedrockGuardrailId=${BEDROCK_GUARDRAIL_ID} --context bedrockGuardrailVersion=${BEDROCK_GUARDRAIL_VERSION}"
          fi
          if [ "${PHONE_TELEPHONY}" = "connect" ]; then
            CTX="${CTX} --context phoneTelephony=connect --context connectInstanceArn=${CONNECT_INSTANCE_ARN}"
          fi
          if [ "${HTTPS_FRONT}" = "cloudfront" ]; then
            CTX="${CTX} --context httpsFront=cloudfront"
          fi
          npx cdk synth ${CTX} --quiet

      - name: Configure AWS credentials (OIDC)
        if: ${{ !inputs.dry_run }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy (builds images on the runner)
        if: ${{ !inputs.dry_run }}
        working-directory: infra/cdk
        # NOTE: `cdk bootstrap` is a ONE-TIME admin step done separately (see DEPLOY-CI.md) — the
        # cdk-scoped deploy role intentionally cannot bootstrap. This step assumes the account is
        # already bootstrapped.
        run: |
          set -euo pipefail
          CTX="--context stage=${STAGE} --context frontendHosting=${FRONTEND} --context authMode=${AUTH_MODE}"
          if [ -n "${DOMAIN_NAME}" ]; then CTX="${CTX} --context domainName=${DOMAIN_NAME}"; fi
          if [ "${BASIC_AUTH}" = "true" ]; then CTX="${CTX} --context basicAuthUser=${BASIC_AUTH_USER}"; fi
          if [ "${EMBEDDING_PROVIDER}" = "openai" ]; then CTX="${CTX} --context embeddingProvider=openai"; fi
          if [ "${ANSWER_LLM}" != "extractive" ]; then CTX="${CTX} --context answerLlm=${ANSWER_LLM}"; fi
          if [ "${STRUCTURED_INGEST}" = "docling" ] || [ "${STRUCTURED_INGEST}" = "docling+bedrock-vision" ]; then
            CTX="${CTX} --context structuredIngest=true"
          fi
          if [ "${STRUCTURED_INGEST}" = "docling+bedrock-vision" ]; then
            CTX="${CTX} --context ingestVision=bedrock"
          fi
          if [ "${VISUAL_PROVIDER_PROFILE}" = "aws-textract-bedrock" ]; then
            CTX="${CTX} --context ocrProvider=aws_textract --context layoutProvider=aws_textract --context structuredProvider=aws_textract --context captioningProvider=bedrock --context vlmProvider=bedrock --context textractRegion=${TEXTRACT_REGION} --context ocrRegion=${TEXTRACT_REGION}"
          fi
          if [ "${VISUAL_EVIDENCE_PROMOTION}" = "true" ]; then
            CTX="${CTX} --context visualEvidencePromotion=true --context visualEvidenceVerifierQuorum=2"
          fi
          if [ -n "${VISUAL_VERIFIER_MODELS}" ]; then
            VERIFIERS="$(printf '%s' "${VISUAL_VERIFIER_MODELS}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' | sed 's/^/bedrock:/' | paste -sd, -)"
            CTX="${CTX} --context visualEvidenceVerifiers=${VERIFIERS}"
          fi
          if [ "${VISUAL_VERIFIER_SAME_FAMILY_ATTESTATION}" = "true" ]; then
            CTX="${CTX} --context visualVerifierAllowSameFamilyDistinctModels=true"
          fi
          if [ -n "${BEDROCK_GUARDRAIL_ID}" ]; then
            CTX="${CTX} --context bedrockGuardrailId=${BEDROCK_GUARDRAIL_ID} --context bedrockGuardrailVersion=${BEDROCK_GUARDRAIL_VERSION}"
          fi
          if [ "${PHONE_TELEPHONY}" = "connect" ]; then
            CTX="${CTX} --context phoneTelephony=connect --context connectInstanceArn=${CONNECT_INSTANCE_ARN}"
          fi
          if [ "${HTTPS_FRONT}" = "cloudfront" ]; then
            CTX="${CTX} --context httpsFront=cloudfront"
          fi
          npx cdk deploy --require-approval never ${CTX}

      - name: Migrate + seed (in-VPC one-off task)
        if: ${{ !inputs.dry_run && inputs.run_migrate_seed }}
        run: |
          set -euo pipefail
          STACK="RakuRag-${STAGE}" AWS_REGION="${AWS_REGION}" bash scripts/aws/migrate-seed.sh

      - name: Outputs
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          echo "## Deploy outputs (stage=${STAGE})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy ref: \`${GITHUB_REF_NAME:-unknown}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          aws cloudformation describe-stacks --stack-name "RakuRag-${STAGE}" \
            --query "Stacks[0].[StackStatus,LastUpdatedTime]" --output text \
            | awk '{print "CloudFormation: " $1 " updated=" $2}' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          aws cloudformation describe-stacks --stack-name "RakuRag-${STAGE}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiLoadBalancerDnsName'].OutputValue" --output text \
            | sed 's#^#Public URL (http): http://#' >> "$GITHUB_STEP_SUMMARY"
          # Present only when https_front=cloudfront (the secure-context entry point).
          aws cloudformation describe-stacks --stack-name "RakuRag-${STAGE}" \
            --query "Stacks[0].Outputs[?OutputKey=='HttpsFrontUrl'].OutputValue" --output text \
            | sed '/^[[:space:]]*$/d; s#^#Public URL (https, CloudFront): #' >> "$GITHUB_STEP_SUMMARY"

      - name: Live smoke (Cognito + production probes)
        if: ${{ !inputs.dry_run && inputs.run_live_smoke }}
        env:
          RAKU_PROD_SMOKE_APPROVED: "yes"
          RAKU_SMOKE_USERNAME: ${{ secrets.RAKU_SMOKE_USERNAME }}
          RAKU_SMOKE_PASSWORD: ${{ secrets.RAKU_SMOKE_PASSWORD }}
          RAKU_SMOKE_OTHER_USERNAME: ${{ secrets.RAKU_SMOKE_OTHER_USERNAME }}
          RAKU_SMOKE_OTHER_PASSWORD: ${{ secrets.RAKU_SMOKE_OTHER_PASSWORD }}
          RAKU_SMOKE_COLLECTION_ID: ${{ vars.RAKU_SMOKE_COLLECTION_ID }}
          RAKU_SMOKE_GROUNDED_QUERY: ${{ vars.RAKU_SMOKE_GROUNDED_QUERY }}
          RAKU_SMOKE_HIGH_RISK_QUERY: ${{ vars.RAKU_SMOKE_HIGH_RISK_QUERY }}
          RAKU_SMOKE_POISON_QUERY: ${{ vars.RAKU_SMOKE_POISON_QUERY }}
          RAKU_SMOKE_ACL_QUERY: ${{ vars.RAKU_SMOKE_ACL_QUERY }}
          RAKU_SMOKE_FORBIDDEN_DOCUMENT_ID: ${{ vars.RAKU_SMOKE_FORBIDDEN_DOCUMENT_ID }}
          RAKU_SMOKE_DELETED_QUERY: ${{ vars.RAKU_SMOKE_DELETED_QUERY }}
          RAKU_SMOKE_DELETED_DOCUMENT_ID: ${{ vars.RAKU_SMOKE_DELETED_DOCUMENT_ID }}
          RAKU_SMOKE_LANGFUSE_TRACE_CHECK_URL: ${{ secrets.RAKU_SMOKE_LANGFUSE_TRACE_CHECK_URL }}
          RAKU_SMOKE_DLQ_CHECK_URL: ${{ secrets.RAKU_SMOKE_DLQ_CHECK_URL }}
          RAKU_PROD_SMOKE_ALLOW_SKIPS: ${{ vars.RAKU_PROD_SMOKE_ALLOW_SKIPS }}
        run: |
          set -euo pipefail
          STACK="RakuRag-${STAGE}" AWS_REGION="${AWS_REGION}" bash scripts/aws/run-prod-smoke-from-stack.sh
          echo "Live smoke: PASS" >> "$GITHUB_STEP_SUMMARY"
